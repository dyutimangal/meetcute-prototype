<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>meetcute</title>
    <style>
      :root { --bg: #0f172a; --accent: #ff7a59; --muted: #94a3b8; }
      html,body{height:100%;margin:0}
      body{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#07102a 0%,#0b1220 100%);color: #e6eef6;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial}
      .card{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:2.5rem;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.02));box-shadow:0 6px 30px rgba(2,6,23,0.6);text-align:center;min-width:260px}
      h1{font-weight:700;font-size:48px;margin:0;background:linear-gradient(90deg,#fff,#ffd1b8);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
      p{margin:0;color:var(--muted)}
      .meta{margin-top:.75rem;font-size:.88rem;color:var(--muted)}
      .cta{margin-top:1.25rem;padding:.5rem .9rem;border-radius:8px;background:linear-gradient(90deg,#ff7a59,#ffb199);color:#111;font-weight:600;text-decoration:none}
    </style>
  </head>
  <body>
    <div class="card" role="main">
      <h1>meetcute</h1>
      <p class="meta">Claim a unique username and visit your personal page.</p>

      <form id="signup" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:.5rem">
        <input id="username" name="username" placeholder="choose a username (eg: alex123)" autocomplete="off" style="padding:.6rem .8rem;border-radius:8px;border:1px solid rgba(255,255,255,0.06);width:100%;max-width:320px;background:transparent;color:inherit" />
        <input id="email" name="email" placeholder="you@example.com" type="email" autocomplete="email" style="padding:.6rem .8rem;border-radius:8px;border:1px solid rgba(255,255,255,0.06);width:100%;max-width:320px;background:transparent;color:inherit" />
        <div id="message" style="font-size:.9rem;color:var(--muted);min-height:1.1rem"></div>
        <button class="cta" type="submit">Claim username</button>
      </form>

      <p class="meta" style="margin-top:1rem;font-size:.8rem;color:var(--muted)">Already have a username? <a href="#" id="openLogin" style="color:var(--accent);text-decoration:none">Log in here</a> to open your profile.</p>
    </div>

    <!-- Login modal (hidden by default) -->
    <div id="loginModal" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(2,6,23,0.6)">
      <div style="background:#061029;padding:1.25rem;border-radius:12px;min-width:300px;color:#e6eef6">
        <h3 style="margin:0 0 .5rem 0">Log in</h3>
        <p style="margin:0 0 .75rem 0;color:var(--muted);font-size:.95rem">Enter your username and email to open your page.</p>
        <form id="loginModalForm" style="display:flex;flex-direction:column;gap:.5rem">
          <input id="modal-username" placeholder="username" autocomplete="username" style="padding:.6rem;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit" />
          <input id="modal-email" placeholder="you@example.com" type="email" autocomplete="email" style="padding:.6rem;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit" />
          <div id="modal-msg" style="min-height:1.1rem;color:var(--muted);font-size:.9rem"></div>
          <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:.25rem">
            <button type="button" id="modalCancel" style="background:transparent;border:1px solid rgba(255,255,255,0.06);padding:.4rem .6rem;border-radius:8px;color:#ffd1b8;cursor:pointer">Cancel</button>
            <button type="submit" style="padding:.45rem .8rem;border-radius:8px;border:none;background:linear-gradient(90deg,#ff7a59,#ffb199);color:#111;font-weight:600;cursor:pointer">Open my page</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      function getCookie(name) {
        const pairs = (document.cookie || '').split(';').map(s => s.trim());
        for (const p of pairs) {
          if (!p) continue;
          const [k, ...v] = p.split('=');
          if (k === name) return decodeURIComponent((v || []).join('='));
        }
        return undefined;
      }

      function doLogout() {
        document.cookie = 'meetcute_user=; Path=/; max-age=0; SameSite=Lax';
        window.location.href = '/';
      }

      // show logged-in user if present
      (function showLogged() {
        const logged = getCookie('meetcute_user');
        if (!logged) return;
        const meta = document.createElement('div');
        meta.style.marginTop = '0.8rem';
        meta.style.fontSize = '0.9rem';
        meta.style.color = 'var(--muted)';
        meta.innerHTML = `Logged in as <strong>${logged}</strong> — <a href="#" id="logoutLanding" style="color:var(--accent);text-decoration:none">Logout</a>`;
        document.querySelector('.card').appendChild(meta);
        document.getElementById('logoutLanding').addEventListener('click', (e) => { e.preventDefault(); doLogout(); });
      })();
        // Login modal handling
        const openLogin = document.getElementById('openLogin');
        const loginModal = document.getElementById('loginModal');
        const modalForm = document.getElementById('loginModalForm');
        const modalCancel = document.getElementById('modalCancel');
        const modalMsg = document.getElementById('modal-msg');

        openLogin.addEventListener('click', (e) => { e.preventDefault(); loginModal.style.display = 'flex'; });
        modalCancel.addEventListener('click', () => { loginModal.style.display = 'none'; modalMsg.textContent = ''; });

        modalForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const u = (document.getElementById('modal-username').value || '').trim();
          const em = (document.getElementById('modal-email').value || '').trim().toLowerCase();
          if (!u) return modalMsg.textContent = 'Please enter your username.';
          if (!em) return modalMsg.textContent = 'Please enter your email.';
          modalMsg.textContent = 'Checking...';
          try {
            const res = await fetch('/api/users/' + encodeURIComponent(u));
            if (res.status === 404) {
              modalMsg.textContent = "hmm we don't have your details, try signing up?";
              return;
            }
            if (!res.ok) {
              modalMsg.textContent = 'Unexpected error. Try again.';
              return;
            }
            const data = await res.json();
            const stored = (data.email || '').trim().toLowerCase();
            if (stored && stored === em) {
              document.cookie = 'meetcute_user=' + encodeURIComponent(u) + '; Path=/; max-age=' + (60 * 60 * 24 * 14) + '; SameSite=Lax';
              window.location.href = '/' + encodeURIComponent(u);
              return;
            }
            modalMsg.textContent = "hmm we don't have your details, try signing up?";
          } catch (err) {
            modalMsg.textContent = 'Network error. Please try again.';
          }
        });
      const form = document.getElementById('signup');
      const usernameInput = document.getElementById('username');
      const messageEl = document.getElementById('message');

      function showMessage(text, isError) {
        messageEl.textContent = text;
        messageEl.style.color = isError ? '#ffb4a0' : 'var(--muted)';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = usernameInput.value && usernameInput.value.trim();
        const email = (document.getElementById('email').value || '').trim();
        const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        if (!username) return showMessage('Please enter a username.', true);
        if (!email) return showMessage('Please enter an email address.', true);
        if (!emailValid) return showMessage('Please enter a valid email address.', true);

        showMessage('Checking and creating your username...', false);

        try {
          const resp = await fetch('/api/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email })
          });

          if (resp.status === 201 || resp.status === 200) {
            // success (created or already existed) — set cookie and redirect to the user's page
            // set cookie for 14 days
            document.cookie = 'meetcute_user=' + encodeURIComponent(username) + '; Path=/; max-age=' + (60 * 60 * 24 * 14) + '; SameSite=Lax';
            window.location.href = '/' + encodeURIComponent(username);
            return;
          }

          const data = await resp.json();
          if (resp.status === 409) {
            const err = await resp.json().catch(() => ({}));
            if (err.error && err.error.includes('another email')) {
              showMessage('That username is already taken by a different email. Try a different username or use the email associated with that username.', true);
            } else if (err.error && err.error.includes('email')) {
              showMessage('That email is already in use by another account — try logging in or use another email.', true);
            } else {
              showMessage('That username is already taken — try another one.', true);
            }
            return;
          }
          showMessage(data.error || 'Unexpected error — try again.', true);
        } catch (err) {
          showMessage('Network error. Check your connection and try again.', true);
        }
      });
    </script>
  </body>
</html>
